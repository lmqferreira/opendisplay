name: Tests

# Nothing checked pull requests before this, so a branch that did not compile
# (or a test target that could not build) only surfaced on someone's laptop.
on:
  pull_request:
  push:
    branches: [main, 'update/**']

# A superseded run tells us nothing, so drop in-flight runs for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      # Deliberately without DEVELOPMENT_TEAM: these are unsigned development
      # builds, not releases. Needing no secrets means this check also runs
      # on pull requests from forks.
      - name: Generate project
        run: xcodegen generate

      # Builds the Mac app as well as the test bundle, since the scheme covers
      # both — so this is a compile check for the app on top of the tests.
      - name: Run macOS tests
        run: |
          xcodebuild test \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMac \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=1.30.1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package development sender
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Debug/OpenDisplay Dev.app" \
            build/OpenDisplay-Dev.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Dev-${{ github.sha }}
          path: build/OpenDisplay-Dev.zip
          if-no-files-found: error
          retention-days: 7

      # The receiver app has a much lower deployment target than the sender
      # (issue #241); building it is what catches an API that only exists on
      # newer macOS sneaking into Shared/ or the receiver.
      - name: Build macOS receiver app
        run: |
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMacReceiver \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # Same runner, Xcode and Ruby setup as the release workflow's build-ios job,
  # so a pull request finds out when that image stops working, not a release.
  ios:
    # This fork update changes only the Mac sender; use the released receivers.
    if: github.repository == 'peetzweg/opendisplay'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Shared protocol/receiver code is also compiled into the universal
      # iPhone+iPad app. Catch a mobile-only compile or asset failure on the
      # change that introduced it, before release-please creates a tag and the
      # release workflow attempts its TestFlight upload.
      - name: Build iOS and iPadOS receiver app
        run: |
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecariOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # iPhone Duo letterboxes apps built with an iOS SDK older than 27.1.
      - name: Check the iOS SDK
        run: |
          sdk=$(/usr/libexec/PlistBuddy -c "Print :DTPlatformVersion" \
            build/ios/Build/Products/Release-iphoneos/OpenSidecariOS.app/Info.plist)
          echo "Built with the iOS $sdk SDK"
          ruby -e 'exit Gem::Version.new(ARGV[0]) >= Gem::Version.new("27.1")' "$sdk"

      - name: fastlane loads the iOS upload lane
        run: bundle exec fastlane lanes | grep -q "ios beta"

  android:
    if: github.repository == 'peetzweg/opendisplay'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Lint is what catches a platform API above minSdk 21 sneaking in
      # without an SDK_INT guard. assembleRelease (unsigned) runs the release
      # variant's lintVital and resource checks, which otherwise first run in
      # the release workflow after the tag already exists. The bundle is the
      # Google Play build, which needs minSdk 24.
      - name: Unit tests, lint, debug and release builds
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Google Play bundle (minSdk 24)
        run: ./gradlew --no-daemon bundleRelease -PappMinSdk=24

      # The release workflow uploads that bundle with fastlane on Linux; a
      # lane that no longer loads would otherwise first fail on release day.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: fastlane loads the Play upload lane
        working-directory: .
        run: bundle exec fastlane lanes | grep -q "android play_beta"
